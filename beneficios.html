<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden Benefits Club | Baby Golden Perú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --gold:#b18a4a;
  --gold-dark:#8d6b35;
  --ink:#292521;
  --muted:#77716a;
  --cream:#f5f2ed;
  --line:#ebe5dc;
  --soft:#faf8f5;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--ink);
}

.container{
  width:min(1120px,100%);
  margin:auto;
  padding:28px 18px 70px;
}

/* =========================
   ENCABEZADO
========================= */

.hero{
  text-align:center;
  padding:18px 10px 28px;
}

.brand-kicker{
  color:var(--gold);
  font-size:11px;
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
}

h1{
  margin:10px 0 8px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,5vw,54px);
  line-height:1.05;
  font-weight:400;
}

.hero p{
  max-width:650px;
  margin:0 auto;
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
}

.hero-rule{
  width:54px;
  height:2px;
  margin:20px auto 0;
  background:var(--gold);
}

/* =========================
   BUSCADOR
========================= */

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin:0 auto 24px;
  max-width:980px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:230px;
}

.search input{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  outline:none;
  font-size:14px;
}

.search input:focus{
  border-color:#c9aa77;
  box-shadow:0 0 0 3px rgba(177,138,74,.12);
}

.filters{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.filter{
  border:1px solid var(--line);
  background:#fff;
  color:#5e574f;
  padding:10px 13px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.filter.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  max-width:980px;
  margin:0 auto;
}

/* =========================
   MARCA
========================= */

.brand-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(42,34,25,.07);
  transition:transform .2s ease,box-shadow .2s ease;
}

.brand-card:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 42px rgba(42,34,25,.1);
}

.brand-top{
  padding:22px 22px 18px;
  display:flex;
  gap:16px;
  align-items:center;
}

.logo-wrap{
  width:82px;
  height:82px;
  flex:0 0 82px;
  border-radius:18px;
  background:var(--soft);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logo-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:10px;
}

.logo-fallback{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--gold);
}

.brand-info{
  min-width:0;
  flex:1;
}

.brand-name{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  line-height:1.1;
  margin:0 0 5px;
}

.brand-category{
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#9a938a;
  font-weight:700;
}

.brand-description{
  margin:9px 0 0;
  color:#625c55;
  font-size:13px;
  line-height:1.55;
}

/* =========================
   BENEFICIO
========================= */

.benefit-box{
  margin:0 16px 16px;
  padding:20px;
  border-radius:18px;
  background:linear-gradient(145deg,#faf8f5,#f7f2e9);
  border:1px solid #eee5d7;
}

.benefit-label{
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#8f877d;
  font-weight:700;
  margin-bottom:8px;
}

.discount{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--gold);
  font-size:34px;
  font-weight:700;
  line-height:1;
}

.benefit-title{
  margin-top:8px;
  font-size:14px;
  font-weight:700;
}

.benefit-description{
  margin-top:8px;
  font-size:13px;
  color:#655e56;
  line-height:1.55;
}

.meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.pill{
  padding:7px 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid #e6ded3;
  color:#6d665e;
  font-size:10px;
  font-weight:700;
}

.pill.gold{
  color:var(--gold-dark);
  border-color:#dec8a6;
  background:#fffaf1;
}

/* =========================
   DETALLES
========================= */

.details{
  padding:0 22px 20px;
}

details{
  border-top:1px solid var(--line);
  padding-top:14px;
}

summary{
  cursor:pointer;
  list-style:none;
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px;
  color:#554e47;
}

summary::-webkit-details-marker{
  display:none;
}

summary:after{
  content:'+';
  float:right;
  color:var(--gold);
  font-size:18px;
  line-height:10px;
}

details[open] summary:after{
  content:'−';
}

.detail-content{
  padding-top:14px;
  color:#666059;
  font-size:12px;
  line-height:1.65;
}

.detail-row{
  margin-bottom:10px;
}

.detail-row strong{
  display:block;
  color:#37312c;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:3px;
}

/* =========================
   CONTACTOS
========================= */

.contacts{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.contact{
  text-decoration:none;
  color:#fff;
  background:var(--ink);
  padding:10px 12px;
  border-radius:10px;
  font-size:11px;
  font-weight:700;
}

.contact.gold{
  background:var(--gold);
}

/* =========================
   CARGANDO / VACÍO
========================= */

.empty,
.loading{
  grid-column:1/-1;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:50px 25px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  color:#9b948b;
  font-size:10px;
  letter-spacing:1px;
  margin-top:34px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:760px){

  .grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    align-items:stretch;
  }

  .filters{
    width:100%;
  }

  .filter{
    flex:1;
  }
}

@media(max-width:480px){

  .container{
    padding:18px 12px 50px;
  }

  .brand-top{
    padding:18px 17px 15px;
  }

  .logo-wrap{
    width:68px;
    height:68px;
    flex-basis:68px;
  }

  .brand-name{
    font-size:24px;
  }

  .benefit-box{
    margin:0 12px 12px;
    padding:17px;
  }

  .details{
    padding:0 17px 18px;
  }
}

</style>
</head>

<body>

<div class="container">

  <header class="hero">

    <div class="brand-kicker">
      Baby Golden Perú
    </div>

    <h1>
      Golden Benefits Club
    </h1>

    <p>
      Beneficios exclusivos de nuestras marcas afiliadas
      para la comunidad Baby Golden Perú.
    </p>

    <div class="hero-rule"></div>

  </header>


  <section class="toolbar">

    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="Buscar marca o beneficio..."
        autocomplete="off"
      >

    </div>


    <div class="filters">

      <button
        class="filter active"
        data-filter="todos"
      >
        Todos
      </button>

      <button
        class="filter"
        data-filter="id"
      >
        ID Baby Golden
      </button>

      <button
        class="filter"
        data-filter="black"
      >
        BLACK ID
      </button>

      <button
        class="filter"
        data-filter="premium"
      >
        PREMIUM ID
      </button>

    </div>

  </section>


  <main
    id="brandGrid"
    class="grid"
  >

    <div class="loading">
      Cargando beneficios...
    </div>

  </main>


  <footer class="footer">
    BABY GOLDEN PERÚ · GOLDEN BENEFITS CLUB
  </footer>

</div>


<script>

const SUPABASE_URL =
  "https://cxgcmrpqqaachnfavplh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6ZXdTZFUqYZUR-4aGU9VSQ_X8rtNtxY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const grid =
  document.getElementById(
    "brandGrid"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );


let beneficios = [];

let filtroActual =
  "todos";


/* =========================
   SEGURIDAD
========================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   FECHA
========================= */

function formatDate(date){

  if(!date){
    return "";
  }

  const p =
    String(date).split("-");

  if(p.length !== 3){
    return date;
  }

  return `${p[2]}/${p[1]}/${p[0]}`;
}


/* =========================
   ACCESOS
========================= */

function accessLabels(beneficio){

  const labels = [];

  if(beneficio.acceso_id){
    labels.push("ID BABY GOLDEN");
  }

  if(beneficio.acceso_black){
    labels.push("BLACK ID");
  }

  if(beneficio.acceso_premium){
    labels.push("PREMIUM ID");
  }

  return labels;
}


/* =========================
   URL
========================= */

function normalizeUrl(url){

  if(!url){
    return "";
  }

  const value =
    String(url).trim();

  if(
    /^https?:\/\//i.test(value)
  ){
    return value;
  }

  return "https://" + value;
}


/* =========================
   RENDER
========================= */

function render(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    beneficios.filter(
      item => {

        const text = [

          item.marca?.nombre,

          item.marca?.categoria,

          item.marca?.descripcion,

          item.titulo,

          item.descuento,

          item.descripcion,

          item.condiciones

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const matchesSearch =
          !query ||
          text.includes(query);


        const access =
          accessLabels(item);


        const matchesFilter =

          filtroActual === "todos"

          ||

          (
            filtroActual === "id" &&
            access.includes(
              "ID BABY GOLDEN"
            )
          )

          ||

          (
            filtroActual === "black" &&
            access.includes(
              "BLACK ID"
            )
          )

          ||

          (
            filtroActual === "premium" &&
            access.includes(
              "PREMIUM ID"
            )
          );


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        No encontramos beneficios
        con esos criterios.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    filtered.map(
      item => {

        const m =
          item.marca;


        const logo =
          normalizeUrl(
            m.logo_url
          );


        const access =
          accessLabels(item);


        const contacts = [];


        if(m.whatsapp){

          const numero =
            String(
              m.whatsapp
            ).replace(
              /\D/g,
              ""
            );


          contacts.push(`
            <a
              class="contact gold"
              href="https://wa.me/${numero}"
              target="_blank"
              rel="noopener"
            >
              WhatsApp
            </a>
          `);

        }


        if(m.instagram){

          contacts.push(`
            <a
              class="contact"
              href="${escapeHTML(
                normalizeUrl(
                  m.instagram
                )
              )}"
              target="_blank"
              rel="noopener"
            >
              Instagram
            </a>
          `);

        }


        if(m.web){

          contacts.push(`
            <a
              class="contact"
              href="${escapeHTML(
                normalizeUrl(
                  m.web
                )
              )}"
              target="_blank"
              rel="noopener"
            >
              Web
            </a>
          `);

        }


        return `

          <article
            class="brand-card"
          >

            <div
              class="brand-top"
            >

              <div
                class="logo-wrap"
              >

                ${
                  logo

                  ?

                  `
                    <img
                      src="${escapeHTML(logo)}"
                      alt="Logo ${escapeHTML(m.nombre)}"
                      onerror="
                        this.style.display='none';
                        this.parentElement.innerHTML=
                        '<span class=\\'logo-fallback\\'>${escapeHTML(
                          m.nombre.charAt(0)
                        )}</span>'
                      "
                    >
                  `

                  :

                  `
                    <span
                      class="logo-fallback"
                    >
                      ${escapeHTML(
                        m.nombre.charAt(0)
                      )}
                    </span>
                  `
                }

              </div>


              <div
                class="brand-info"
              >

                <h2
                  class="brand-name"
                >
                  ${escapeHTML(
                    m.nombre
                  )}
                </h2>


                <div
                  class="brand-category"
                >
                  ${escapeHTML(
                    m.categoria ||
                    "Marca afiliada"
                  )}
                </div>


                ${
                  m.descripcion

                  ?

                  `
                    <p
                      class="brand-description"
                    >
                      ${escapeHTML(
                        m.descripcion
                      )}
                    </p>
                  `

                  :

                  ""
                }

              </div>

            </div>


            <div
              class="benefit-box"
            >

              <div
                class="benefit-label"
              >
                Beneficio exclusivo
              </div>


              <div
                class="discount"
              >
                ${escapeHTML(
                  item.descuento ||
                  "BENEFICIO"
                )}
              </div>


              <div
                class="benefit-title"
              >
                ${escapeHTML(
                  item.titulo ||
                  ""
                )}
              </div>


              ${
                item.descripcion

                ?

                `
                  <div
                    class="benefit-description"
                  >
                    ${escapeHTML(
                      item.descripcion
                    )}
                  </div>
                `

                :

                ""
              }


              <div
                class="meta"
              >

                ${
                  access
                    .map(
                      a => `
                        <span
                          class="pill gold"
                        >
                          ${escapeHTML(a)}
                        </span>
                      `
                    )
                    .join("")
                }


                ${
                  item.fecha_fin

                  ?

                  `
                    <span
                      class="pill"
                    >
                      Válido hasta
                      ${escapeHTML(
                        formatDate(
                          item.fecha_fin
                        )
                      )}
                    </span>
                  `

                  :

                  ""
                }

              </div>

            </div>


            <div
              class="details"
            >

              <details>

                <summary>
                  VER CONDICIONES Y DETALLES
                </summary>


                <div
                  class="detail-content"
                >

                  ${
                    item.codigo

                    ?

                    `
                      <div
                        class="detail-row"
                      >

                        <strong>
                          Código
                        </strong>

                        ${escapeHTML(
                          item.codigo
                        )}

                      </div>
                    `

                    :

                    ""
                  }


                  ${
                    item.condiciones

                    ?

                    `
                      <div
                        class="detail-row"
                      >

                        <strong>
                          Condiciones
                        </strong>

                        ${escapeHTML(
                          item.condiciones
                        )}

                      </div>
                    `

                    :

                    ""
                  }


                  <div
                    class="detail-row"
                  >

                    <strong>
                      Disponible para
                    </strong>

                    ${escapeHTML(
                      access.join(
                        " · "
                      ) ||
                      "Comunidad Baby Golden"
                    )}

                  </div>


                  ${
                    contacts.length

                    ?

                    `
                      <div
                        class="contacts"
                      >
                        ${contacts.join("")}
                      </div>
                    `

                    :

                    ""
                  }

                </div>

              </details>

            </div>

          </article>

        `;

      }
    )
    .join("");

}


/* =========================
   CARGAR BENEFICIOS
========================= */

async function cargarBeneficios(){

  grid.innerHTML = `
    <div class="loading">
      Cargando beneficios...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient

      .from(
        "beneficios_golden"
      )

      .select(`
        id,
        titulo,
        descuento,
        codigo,
        descripcion,
        condiciones,
        fecha_fin,
        acceso_id,
        acceso_black,
        acceso_premium,
        estado,

        marca:marcas_afiliadas!inner(
          id,
          nombre,
          categoria,
          descripcion,
          logo_url,
          whatsapp,
          instagram,
          web,
          estado
        )
      `)

      .eq(
        "estado",
        true
      )

      .eq(
        "marca.estado",
        true
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        No pudimos cargar los beneficios.
        Intenta nuevamente en unos minutos.
      </div>
    `;

    return;
  }


  beneficios =
    data || [];


  render();

}


/* =========================
   BUSCADOR
========================= */

searchInput.addEventListener(
  "input",
  render
);


/* =========================
   FILTROS
========================= */

document
  .querySelectorAll(
    ".filter"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          filtroActual =
            button.dataset.filter;


          render();

        }
      );

    }
  );


/* =========================
   INICIO
========================= */

cargarBeneficios();

</script>

</body>
</html>
