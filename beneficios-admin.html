<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Golden Benefits | Administración</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f5f2ed;
  color: #292521;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 25px 16px 60px;
}


/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  margin-bottom: 30px;
}

.brand {
  color: #b18a4a;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
}

h1 {
  margin: 10px 0 5px;
  font-family: Georgia, serif;
  font-size: 36px;
  font-weight: normal;
}

.subtitle {
  color: #777;
  font-size: 14px;
}


/* =========================
   CARD
========================= */

.card {
  background: #fff;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
  margin-bottom: 20px;
}


/* =========================
   LOGIN
========================= */

.login-card {
  max-width: 430px;
  margin: 70px auto;
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px 14px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 14px;
  font-family: Arial, sans-serif;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #2d2925;
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.gold {
  background: #b18a4a;
}

button.danger {
  background: #a83b3b;
}

button.secondary {
  background: #eee;
  color: #333;
}


/* =========================
   VISTAS
========================= */

#loginView {
  display: block;
}

#panelView {
  display: none;
}


/* =========================
   ACCIONES
========================= */

.top-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

.top-actions button {
  width: auto;
}

.logout {
  background: #eee;
  color: #333;
  padding: 10px 16px;
}


/* =========================
   FORMULARIO
========================= */

.form {
  display: none;
  border-top: 1px solid #eee;
  margin-top: 25px;
  padding-top: 25px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full {
  grid-column: 1 / -1;
}


/* =========================
   LOGO
========================= */

.logo-upload-box {
  background: #faf8f5;
  border: 1px dashed #d8c9ad;
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  margin-bottom: 15px;
}

.logo-preview {
  width: 150px;
  height: 110px;
  background: white;
  border-radius: 15px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.logo-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 10px;
}

.logo-placeholder {
  color: #aaa;
  font-family: Georgia, serif;
  font-size: 30px;
}

.file-input {
  width: 100%;
  padding: 10px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.upload-status {
  margin-top: 10px;
  font-size: 12px;
  color: #777;
}


/* =========================
   CHECKBOXES
========================= */

.checks {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.check {
  background: #f7f4ed;
  border-radius: 20px;
  padding: 10px 14px;
  font-size: 12px;
  cursor: pointer;
}

.check input {
  width: auto;
  margin: 0 6px 0 0;
}


/* =========================
   MENSAJES
========================= */

.message {
  display: none;
  padding: 14px;
  margin-top: 15px;
  border-radius: 12px;
  font-size: 13px;
}

.error {
  background: #fbeaea;
  color: #9b3333;
}

.success {
  background: #eaf7ed;
  color: #276b39;
}


/* =========================
   MARCAS
========================= */

.brand-item {
  border: 1px solid #eee;
  border-radius: 16px;
  padding: 20px;
  margin-top: 15px;
  background: #fff;
}

.brand-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

.brand-main {
  display: flex;
  align-items: center;
  gap: 15px;
}

.brand-mini-logo {
  width: 65px;
  height: 65px;
  border-radius: 14px;
  background: #f5f2ed;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.brand-mini-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 7px;
}

.brand-mini-text {
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: bold;
}

.brand-name {
  font-family: Georgia, serif;
  font-size: 25px;
}

.brand-category {
  color: #999;
  font-size: 11px;
  margin-top: 5px;
}

.status {
  padding: 7px 11px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
}

.status.active {
  background: #eaf7ed;
  color: #276b39;
}

.status.inactive {
  background: #fbeaea;
  color: #9b3333;
}

.benefit {
  margin-top: 18px;
  background: #faf8f5;
  border-radius: 13px;
  padding: 17px;
}

.discount {
  color: #b18a4a;
  font-family: Georgia, serif;
  font-size: 28px;
  font-weight: bold;
}

.benefit-title {
  margin-top: 5px;
  font-size: 13px;
}

.code {
  margin-top: 8px;
  color: #777;
  font-size: 12px;
}

.access {
  margin-top: 10px;
  color: #666;
  font-size: 11px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.actions button {
  width: auto;
  padding: 10px 14px;
}


/* =========================
   EDITOR
========================= */

.edit-box {
  display: none;
  margin-top: 20px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}


/* =========================
   LOADING
========================= */

.loading {
  text-align: center;
  padding: 40px;
  color: #777;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .top-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .top-actions button {
    width: 100%;
  }

  .brand-header {
    flex-direction: column;
  }

  .brand-main {
    align-items: flex-start;
  }

  .actions button {
    width: 100%;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- =================================================
     LOGIN
================================================= -->

<div id="loginView">

  <div class="card login-card">

    <div class="header">

      <div class="brand">
        BABY GOLDEN PERÚ
      </div>

      <h1>
        Golden Benefits
      </h1>

      <div class="subtitle">
        Administración de marcas afiliadas
      </div>

    </div>


    <form id="loginForm">

      <label>
        Correo electrónico
      </label>

      <input
        type="email"
        id="email"
        required
      >


      <label>
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        required
      >


      <button type="submit">
        INGRESAR
      </button>

    </form>


    <div
      id="loginMessage"
      class="message error"
    ></div>

  </div>

</div>



<!-- =================================================
     PANEL
================================================= -->

<div id="panelView">

  <div class="header">

    <div class="brand">
      BABY GOLDEN PERÚ
    </div>

    <h1>
      Golden Benefits Club
    </h1>

    <div class="subtitle">
      Administración de marcas afiliadas
    </div>

  </div>


  <div class="top-actions">

    <button
      id="newBrandButton"
      class="gold"
    >
      + AGREGAR MARCA
    </button>


    <button
      id="logoutButton"
      class="logout"
    >
      CERRAR SESIÓN
    </button>

  </div>



  <!-- =================================================
       FORMULARIO
  ================================================= -->

  <div
    id="brandForm"
    class="card form"
  >

    <h2>
      Nueva marca
    </h2>


    <div class="form-grid">


      <div>

        <label>
          Nombre de la marca
        </label>

        <input
          id="brandName"
          type="text"
          placeholder="Ejemplo: YUM"
        >

      </div>


      <div>

        <label>
          Categoría
        </label>

        <input
          id="brandCategory"
          type="text"
          placeholder="Ejemplo: Alimentación"
        >

      </div>


      <div class="full">

        <label>
          Descripción
        </label>

        <textarea
          id="brandDescription"
          placeholder="Descripción de la marca"
        ></textarea>

      </div>


      <div>

        <label>
          WhatsApp
        </label>

        <input
          id="brandWhatsapp"
          type="text"
        >

      </div>


      <div>

        <label>
          Instagram
        </label>

        <input
          id="brandInstagram"
          type="url"
        >

      </div>


      <div>

        <label>
          Página web
        </label>

        <input
          id="brandWeb"
          type="url"
        >

      </div>


      <!-- =============================
           LOGO
      ============================== -->

      <div class="full">

        <label>
          Logo de la marca
        </label>


        <div class="logo-upload-box">


          <div
            id="newLogoPreview"
            class="logo-preview"
          >

            <div class="logo-placeholder">
              LOGO
            </div>

          </div>


          <input
            id="newLogoFile"
            class="file-input"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          >


          <div
            id="newLogoStatus"
            class="upload-status"
          >

            Selecciona una imagen
            PNG, JPG o WEBP.

          </div>

        </div>

      </div>


      <div class="full">

        <hr>

        <h2>
          Beneficio
        </h2>

      </div>


      <div>

        <label>
          Título
        </label>

        <input
          id="benefitTitle"
          type="text"
          placeholder="Ejemplo: 10% de descuento"
        >

      </div>


      <div>

        <label>
          Descuento
        </label>

        <input
          id="benefitDiscount"
          type="text"
          placeholder="Ejemplo: 10% OFF"
        >

      </div>


      <div>

        <label>
          Código
        </label>

        <input
          id="benefitCode"
          type="text"
        >

      </div>


      <div>

        <label>
          Válido hasta
        </label>

        <input
          id="benefitDate"
          type="date"
        >

      </div>


      <div class="full">

        <label>
          Descripción del beneficio
        </label>

        <textarea
          id="benefitDescription"
        ></textarea>

      </div>


      <div class="full">

        <label>
          Condiciones
        </label>

        <textarea
          id="benefitConditions"
        ></textarea>

      </div>


      <div class="full">

        <label>
          ¿Quién puede utilizarlo?
        </label>


        <div class="checks">


          <label class="check">

            <input
              id="accessId"
              type="checkbox"
            >

            ID Baby Golden

          </label>


          <label class="check">

            <input
              id="accessBlack"
              type="checkbox"
            >

            BLACK ID

          </label>


          <label class="check">

            <input
              id="accessPremium"
              type="checkbox"
            >

            PREMIUM

          </label>


        </div>

      </div>


    </div>


    <div class="actions">


      <button
        id="saveButton"
        class="gold"
      >
        PUBLICAR
      </button>


      <button
        id="cancelButton"
        class="secondary"
      >
        CANCELAR
      </button>

    </div>


    <div
      id="formMessage"
      class="message"
    ></div>


  </div>



  <!-- =================================================
       LISTA
  ================================================= -->

  <div class="card">

    <h2>
      Marcas afiliadas
    </h2>


    <div id="brandList">

      <div class="loading">
        Cargando marcas...
      </div>

    </div>

  </div>


</div>


</div>



<script>

/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
  "https://cxgcmrpqqaachnfavplh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6ZXdTZFUqYZUR-4aGU9VSQ_X8rtNtxY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================================
   ELEMENTOS
================================================= */

const loginView =
  document.getElementById(
    "loginView"
  );

const panelView =
  document.getElementById(
    "panelView"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const loginMessage =
  document.getElementById(
    "loginMessage"
  );

const brandForm =
  document.getElementById(
    "brandForm"
  );

const brandList =
  document.getElementById(
    "brandList"
  );

let nuevoLogoUrl = null;

let nuevoLogoPath = null;


/* =================================================
   LOGIN
================================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginMessage.style.display =
      "none";


    const email =
      document
        .getElementById(
          "email"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "password"
        )
        .value;


    const {
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email,
          password

        });


    if (error) {

      loginMessage.textContent =
        error.message;

      loginMessage.style.display =
        "block";

      return;

    }


    const {
      data: admin,
      error: adminError
    } =
      await supabaseClient.rpc(
        "es_administrador"
      );


    if (
      adminError ||
      !admin
    ) {

      await supabaseClient.auth
        .signOut();


      loginMessage.textContent =
        "Esta cuenta no tiene permisos de administrador.";

      loginMessage.style.display =
        "block";

      return;

    }


    loginView.style.display =
      "none";

    panelView.style.display =
      "block";


    cargarMarcas();

  }
);


/* =================================================
   SESIÓN EXISTENTE
================================================= */

async function revisarSesion() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (
    data &&
    data.session
  ) {

    const {
      data: admin
    } =
      await supabaseClient.rpc(
        "es_administrador"
      );


    if (admin) {

      loginView.style.display =
        "none";

      panelView.style.display =
        "block";

      cargarMarcas();

    }

  }

}


revisarSesion();


/* =================================================
   LOGOUT
================================================= */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth
        .signOut();

      location.reload();

    }
  );


/* =================================================
   NUEVA MARCA
================================================= */

document
  .getElementById(
    "newBrandButton"
  )
  .addEventListener(
    "click",
    function() {

      limpiarFormulario();

      brandForm.style.display =
        "block";

      window.scrollTo({

        top:
          brandForm
            .getBoundingClientRect()
            .top +
          window.scrollY -
          20,

        behavior:
          "smooth"

      });

    }
  );


/* =================================================
   CANCELAR
================================================= */

document
  .getElementById(
    "cancelButton"
  )
  .addEventListener(
    "click",
    function() {

      brandForm.style.display =
        "none";

      limpiarFormulario();

    }
  );


/* =================================================
   VISTA PREVIA LOGO NUEVO
================================================= */

document
  .getElementById(
    "newLogoFile"
  )
  .addEventListener(
    "change",
    function() {

      const archivo =
        this.files[0];


      if (!archivo) {
        return;
      }


      if (
        ![
          "image/png",
          "image/jpeg",
          "image/webp"
        ].includes(
          archivo.type
        )
      ) {

        mostrarMensaje(
          "El logo debe ser PNG, JPG o WEBP.",
          true
        );

        this.value = "";

        return;

      }


      if (
        archivo.size >
        5 * 1024 * 1024
      ) {

        mostrarMensaje(
          "El logo no puede superar 5 MB.",
          true
        );

        this.value = "";

        return;

      }


      const lector =
        new FileReader();


      lector.onload =
        function(event) {

          document
            .getElementById(
              "newLogoPreview"
            )
            .innerHTML = `

              <img
                src="${event.target.result}"
                alt="Vista previa"
              >

            `;

        };


      lector.readAsDataURL(
        archivo
      );


      document
        .getElementById(
          "newLogoStatus"
        )
        .textContent =
          archivo.name;

    }
  );


/* =================================================
   GUARDAR MARCA
================================================= */

document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    guardarMarca
  );


async function guardarMarca() {

  const boton =
    document.getElementById(
      "saveButton"
    );


  const nombre =
    valor(
      "brandName"
    );


  const categoria =
    valor(
      "brandCategory"
    );


  const descripcion =
    valor(
      "brandDescription"
    );


  const whatsapp =
    valor(
      "brandWhatsapp"
    );


  const instagram =
    valor(
      "brandInstagram"
    );


  const web =
    valor(
      "brandWeb"
    );


  const titulo =
    valor(
      "benefitTitle"
    );


  const descuento =
    valor(
      "benefitDiscount"
    );


  const codigo =
    valor(
      "benefitCode"
    );


  const fecha =
    valor(
      "benefitDate"
    ) ||
    null;


  const descripcionBeneficio =
    valor(
      "benefitDescription"
    );


  const condiciones =
    valor(
      "benefitConditions"
    );


  const accesoId =
    document
      .getElementById(
        "accessId"
      )
      .checked;


  const accesoBlack =
    document
      .getElementById(
        "accessBlack"
      )
      .checked;


  const accesoPremium =
    document
      .getElementById(
        "accessPremium"
      )
      .checked;


  if (!nombre) {

    mostrarMensaje(
      "Escribe el nombre de la marca.",
      true
    );

    return;

  }


  if (!categoria) {

    mostrarMensaje(
      "Escribe la categoría.",
      true
    );

    return;

  }


  if (!titulo) {

    mostrarMensaje(
      "Escribe el título del beneficio.",
      true
    );

    return;

  }


  if (
    !accesoId &&
    !accesoBlack &&
    !accesoPremium
  ) {

    mostrarMensaje(
      "Selecciona quién puede utilizar el beneficio.",
      true
    );

    return;

  }


  boton.disabled =
    true;

  boton.textContent =
    "PUBLICANDO...";


  try {

    const slug =
      crearSlug(
        nombre
      );


    const existente =
      await supabaseClient
        .from(
          "marcas_afiliadas"
        )
        .select("id")
        .eq(
          "slug",
          slug
        )
        .maybeSingle();


    if (
      existente.error
    ) {

      throw existente.error;

    }


    if (
      existente.data
    ) {

      throw new Error(
        "Esta marca ya existe."
      );

    }


    /* SUBIR LOGO */

    let logoUrl = null;


    const archivo =
      document
        .getElementById(
          "newLogoFile"
        )
        .files[0];


    if (archivo) {

      const extension =
        obtenerExtension(
          archivo.name
        );


      const nombreArchivo =
        slug +
        "-" +
        Date.now() +
        "." +
        extension;


      const resultadoUpload =
        await supabaseClient
          .storage
          .from(
            "logos-marcas"
          )
          .upload(
            nombreArchivo,
            archivo,
            {
              cacheControl:
                "3600",

              upsert:
                false,

              contentType:
                archivo.type

            }
          );


      if (
        resultadoUpload.error
      ) {

        throw resultadoUpload.error;

      }


      nuevoLogoPath =
        nombreArchivo;


      const resultadoUrl =
        supabaseClient
          .storage
          .from(
            "logos-marcas"
          )
          .getPublicUrl(
            nombreArchivo
          );


      logoUrl =
        resultadoUrl
          .data
          .publicUrl;

    }


    /* CREAR MARCA */

    const resultadoMarca =
      await supabaseClient
        .from(
          "marcas_afiliadas"
        )
        .insert({

          nombre,

          slug,

          logo_url:
            logoUrl,

          descripcion:
            descripcion ||
            null,

          categoria,

          whatsapp:
            whatsapp ||
            null,

          instagram:
            instagram ||
            null,

          web:
            web ||
            null,

          estado:
            true

        })
        .select()
        .single();


    if (
      resultadoMarca.error
    ) {

      if (
        nuevoLogoPath
      ) {

        await eliminarLogo(
          nuevoLogoPath
        );

      }


      throw resultadoMarca.error;

    }


    const marca =
      resultadoMarca.data;


    /* CREAR BENEFICIO */

    const resultadoBeneficio =
      await supabaseClient
        .from(
          "beneficios_golden"
        )
        .insert({

          marca_id:
            marca.id,

          titulo,

          tipo_beneficio:
            "Descuento",

          descuento:
            descuento ||
            null,

          codigo:
            codigo ||
            null,

          descripcion:
            descripcionBeneficio ||
            null,

          condiciones:
            condiciones ||
            null,

          fecha_inicio:
            fecha,

          fecha_fin:
            fecha,

          acceso_id:
            accesoId,

          acceso_black:
            accesoBlack,

          acceso_premium:
            accesoPremium,

          estado:
            true

        });


    if (
      resultadoBeneficio.error
    ) {

      await supabaseClient
        .from(
          "marcas_afiliadas"
        )
        .delete()
        .eq(
          "id",
          marca.id
        );


      if (
        nuevoLogoPath
      ) {

        await eliminarLogo(
          nuevoLogoPath
        );

      }


      throw resultadoBeneficio.error;

    }


    mostrarMensaje(
      "Marca y beneficio publicados correctamente.",
      false
    );


    limpiarFormulario();


    brandForm.style.display =
      "none";


    cargarMarcas();


  } catch (error) {

    console.error(
      error
    );


    mostrarMensaje(
      error.message ||
      "No se pudo guardar.",
      true
    );


  } finally {

    boton.disabled =
      false;

    boton.textContent =
      "PUBLICAR";

  }

}


/* =================================================
   CARGAR MARCAS
================================================= */

async function cargarMarcas() {

  brandList.innerHTML = `

    <div class="loading">
      Cargando marcas...
    </div>

  `;


  try {

    const resultado =
      await supabaseClient
        .from(
          "marcas_afiliadas"
        )
        .select("*")
        .order(
          "nombre"
        );


    if (
      resultado.error
    ) {

      throw resultado.error;

    }


    const marcas =
      resultado.data ||
      [];


    if (
      marcas.length === 0
    ) {

      brandList.innerHTML = `

        <div class="loading">

          No hay marcas afiliadas.

        </div>

      `;

      return;

    }


    brandList.innerHTML =
      "";


    for (
      const marca
      of marcas
    ) {

      await crearMarca(
        marca
      );

    }


  } catch (error) {

    brandList.innerHTML = `

      <div
        class="message error"
        style="display:block;"
      >

        ${escapar(
          error.message
        )}

      </div>

    `;

  }

}

/* =================================================
   GUARDAR CAMBIOS
================================================= */

async function guardarCambios(
  elemento,
  marca,
  beneficio
) {

  const boton =
    elemento.querySelector(
      '[data-action="save"]'
    );


  try {

    boton.disabled =
      true;

    boton.textContent =
      "GUARDANDO...";


    const nombre =
      campo(
        elemento,
        "nombre"
      );


    const categoria =
      campo(
        elemento,
        "categoria"
      );


    const descripcion =
      campo(
        elemento,
        "descripcion"
      );


    const whatsapp =
      campo(
        elemento,
        "whatsapp"
      );


    const instagram =
      campo(
        elemento,
        "instagram"
      );


    const web =
      campo(
        elemento,
        "web"
      );


    if (!nombre) {

      throw new Error(
        "El nombre no puede estar vacío."
      );

    }


    let logoUrl =
      marca.logo_url ||
      null;


    /* =========================
       REEMPLAZAR LOGO
    ========================= */

    const archivo =
      elemento
        .querySelector(
          "[data-logo-file]"
        )
        .files[0];


    if (
      archivo
    ) {

      const extension =
        obtenerExtension(
          archivo.name
        );


      const slug =
        crearSlug(
          nombre
        );


      const nuevoPath =
        slug +
        "-" +
        Date.now() +
        "." +
        extension;


      const upload =
        await supabaseClient
          .storage
          .from(
            "logos-marcas"
          )
          .upload(
            nuevoPath,
            archivo,
            {
              cacheControl:
                "3600",

              upsert:
                false,

              contentType:
                archivo.type

            }
          );


      if (
        upload.error
      ) {

        throw upload.error;

      }


      logoUrl =
        supabaseClient
          .storage
          .from(
            "logos-marcas"
          )
          .getPublicUrl(
            nuevoPath
          )
          .data
          .publicUrl;


      /* Guardamos primero
         la nueva URL */


      const actualizarLogo =
        await supabaseClient
          .from(
            "marcas_afiliadas"
          )
          .update({

            nombre,

            categoria,

            descripcion:
              descripcion ||
              null,

            whatsapp:
              whatsapp ||
              null,

            instagram:
              instagram ||
              null,

            web:
              web ||
              null,

            logo_url:
              logoUrl

          })
          .eq(
            "id",
            marca.id
          );


      if (
        actualizarLogo.error
      ) {

        await eliminarLogo(
          nuevoPath
        );

        throw actualizarLogo.error;

      }


      /* Eliminamos el logo anterior
         solamente después de guardar
         correctamente el nuevo */

      if (
        marca.logo_url
      ) {

        const viejoPath =
          obtenerPathLogo(
            marca.logo_url
          );


        if (
          viejoPath
        ) {

          await eliminarLogo(
            viejoPath
          );

        }

      }


    } else {

      const actualizarMarca =
        await supabaseClient
          .from(
            "marcas_afiliadas"
          )
          .update({

            nombre,

            categoria,

            descripcion:
              descripcion ||
              null,

            whatsapp:
              whatsapp ||
              null,

            instagram:
              instagram ||
              null,

            web:
              web ||
              null

          })
          .eq(
            "id",
            marca.id
          );


      if (
        actualizarMarca.error
      ) {

        throw actualizarMarca.error;

      }

    }


    /* =========================
       ACTUALIZAR BENEFICIO
    ========================= */

    if (
      beneficio
    ) {

      const titulo =
        campoBeneficio(
          elemento,
          "titulo"
        );


      const descuento =
        campoBeneficio(
          elemento,
          "descuento"
        );


      const codigo =
        campoBeneficio(
          elemento,
          "codigo"
        );


      const fechaFin =
        campoBeneficio(
          elemento,
          "fecha_fin"
        );


      const descripcionBeneficio =
        campoBeneficio(
          elemento,
          "descripcion"
        );


      const condiciones =
        campoBeneficio(
          elemento,
          "condiciones"
        );


      const accesoId =
        elemento
          .querySelector(
            '[data-benefit-access="id"]'
          )
          .checked;


      const accesoBlack =
        elemento
          .querySelector(
            '[data-benefit-access="black"]'
          )
          .checked;


      const accesoPremium =
        elemento
          .querySelector(
            '[data-benefit-access="premium"]'
          )
          .checked;


      if (
        !accesoId &&
        !accesoBlack &&
        !accesoPremium
      ) {

        throw new Error(
          "Selecciona al menos un tipo de acceso."
        );

      }


      const actualizarBeneficio =
        await supabaseClient
          .from(
            "beneficios_golden"
          )
          .update({

            titulo,

            descuento:
              descuento ||
              null,

            codigo:
              codigo ||
              null,

            fecha_fin:
              fechaFin ||
              null,

            descripcion:
              descripcionBeneficio ||
              null,

            condiciones:
              condiciones ||
              null,

            acceso_id:
              accesoId,

            acceso_black:
              accesoBlack,

            acceso_premium:
              accesoPremium

          })
          .eq(
            "id",
            beneficio.id
          );


      if (
        actualizarBeneficio.error
      ) {

        throw actualizarBeneficio.error;

      }

    }


    alert(
      "Cambios guardados correctamente."
    );


    cargarMarcas();


  } catch (error) {

    console.error(
      error
    );


    alert(
      error.message ||
      "No se pudieron guardar los cambios."
    );


  } finally {

    boton.disabled =
      false;

    boton.textContent =
      "GUARDAR CAMBIOS";

  }

}


/* =================================================
   UTILIDADES
================================================= */

function valor(
  id
) {

  const elemento =
    document.getElementById(
      id
    );


  return elemento
    ? elemento.value.trim()
    : "";

}


function campo(
  elemento,
  nombre
) {

  const input =
    elemento.querySelector(
      `[data-field="${nombre}"]`
    );


  return input
    ? input.value.trim()
    : "";

}


function campoBeneficio(
  elemento,
  nombre
) {

  const input =
    elemento.querySelector(
      `[data-benefit="${nombre}"]`
    );


  return input
    ? input.value.trim()
    : "";

}


function obtenerAcceso(
  beneficio
) {

  const accesos = [];


  if (
    beneficio.acceso_id
  ) {

    accesos.push(
      "ID"
    );

  }


  if (
    beneficio.acceso_black
  ) {

    accesos.push(
      "BLACK"
    );

  }


  if (
    beneficio.acceso_premium
  ) {

    accesos.push(
      "PREMIUM"
    );

  }


  return accesos.length
    ? accesos.join(
        " + "
      )
    : "SIN ACCESO";

}


function crearSlug(
  texto
) {

  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^a-z0-9]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      "");

}


function obtenerExtension(
  nombre
) {

  const partes =
    nombre.split(".");


  return (
    partes[
      partes.length - 1
    ] ||
    "png"
  ).toLowerCase();

}


function obtenerPathLogo(
  url
) {

  if (!url) {
    return null;
  }


  const marcador =
    "/logos-marcas/";


  const posicion =
    url.indexOf(
      marcador
    );


  if (
    posicion === -1
  ) {

    return null;

  }


  return decodeURIComponent(
    url.substring(
      posicion +
      marcador.length
    )
  );

}


async function eliminarLogo(
  path
) {

  if (!path) {
    return;
  }


  await supabaseClient
    .storage
    .from(
      "logos-marcas"
    )
    .remove([
      path
    ]);

}


function escapar(
  valor
) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }


  return String(
    valor
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function mostrarMensaje(
  texto,
  error
) {

  const elemento =
    document.getElementById(
      "formMessage"
    );


  elemento.textContent =
    texto;


  elemento.className =
    "message " +
    (
      error
        ? "error"
        : "success"
    );


  elemento.style.display =
    "block";

}


function limpiarFormulario() {

  const ids = [

    "brandName",
    "brandCategory",
    "brandDescription",
    "brandWhatsapp",
    "brandInstagram",
    "brandWeb",
    "benefitTitle",
    "benefitDiscount",
    "benefitCode",
    "benefitDate",
    "benefitDescription",
    "benefitConditions"

  ];


  ids.forEach(
    id => {

      const elemento =
        document.getElementById(
          id
        );


      if (elemento) {

        elemento.value =
          "";

      }

    }
  );


  [
    "accessId",
    "accessBlack",
    "accessPremium"
  ]
  .forEach(
    id => {

      const elemento =
        document.getElementById(
          id
        );


      if (elemento) {

        elemento.checked =
          false;

      }

    }
  );


  const archivo =
    document.getElementById(
      "newLogoFile"
    );


  if (archivo) {

    archivo.value =
      "";

  }


  const preview =
    document.getElementById(
      "newLogoPreview"
    );


  if (preview) {

    preview.innerHTML = `

      <div class="logo-placeholder">
        LOGO
      </div>

    `;

  }


  const status =
    document.getElementById(
      "newLogoStatus"
    );


  if (status) {

    status.textContent =
      "Selecciona una imagen PNG, JPG o WEBP.";

  }


  nuevoLogoUrl =
    null;

  nuevoLogoPath =
    null;

}

</script>
