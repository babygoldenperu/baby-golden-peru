/* ========================================

const SUPABASE_URL =

const SUPABASE_KEY =

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   SEGURIDAD HTML
======================================== */

function escaparHTML(texto) {

  if (
    texto === null ||
    texto === undefined
  ) {
    return "";
  }

  return String(texto)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


/* ========================================
   FECHA
======================================== */

function formatearFecha(fecha) {

  if (!fecha) {
    return "No registrada";
  }

  const partes =
    fecha.split("-");

  if (
    partes.length !== 3
  ) {
    return fecha;
  }

  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );
}


/* ========================================
   CARGAR PERFIL
======================================== */

async function cargarPerfil() {


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const babyGoldenId =
    parametros.get("id");


  if (!babyGoldenId) {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        No se indicó un
        Baby Golden ID.

      </div>

    `;

    return;
  }


  /* ======================================
     CONSULTAR SUPABASE
  ====================================== */

  const {
    data,
    error
  } = await supabaseClient.rpc(

    "obtener_baby_golden_publico",

    {
      p_baby_golden_id:
        babyGoldenId
    }

  );


  if (error) {

    console.error(
      "ERROR PERFIL:",
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        No pudimos cargar
        este Baby Golden ID.

      </div>

    `;

    return;
  }


  const perfil =
    Array.isArray(data)
      ? data[0]
      : data;


  if (!perfil) {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        Este Baby Golden ID
        no existe.

      </div>

    `;

    return;
  }


  /* ======================================
     DETECTAR TIPO DE ID
  ====================================== */

  const dataPerfil = perfil;

  const esBlack =
    dataPerfil.tipo_id === "Black ID";


  const claseTarjeta =
    esBlack
      ? "black"
      : "premium";


  const app =
    document.getElementById(
      "app"
    );


  app.className =
    "card " +
    claseTarjeta;


  /* ======================================
     FOTO PRIVADA
  ====================================== */

  let fotoUrl = "";


  if (dataPerfil.foto_url) {

    const {
      data: fotoFirmada,
      error: errorFoto
    } =
      await supabaseClient
        .storage
        .from("fotos-perritos")
        .createSignedUrl(
          dataPerfil.foto_url,
          3600
        );


    if (errorFoto) {

      console.error(
        "ERROR FOTO:",
        errorFoto
      );

    } else {

      fotoUrl =
        fotoFirmada.signedUrl;

    }

  }


  /* ======================================
     TÍTULO
  ====================================== */

  document.title =
    dataPerfil.nombre_perrito +
    " | " +
    dataPerfil.baby_golden_id;


  /* ======================================
     FOTO HTML
  ====================================== */

  const fotoHTML =
    fotoUrl

      ? `

        <div class="photo-container">

          <img
            class="photo"
            src="${escaparHTML(fotoUrl)}"
            alt="Fotografía de ${escaparHTML(dataPerfil.nombre_perrito)}"
          >

        </div>

      `

      : "";

/* ======================================
   CONTACTO
====================================== */

let botonesContacto = "";

const tieneRedSocial =
  dataPerfil.red_social &&
  String(dataPerfil.red_social).trim() !== "";

const tieneCelular =
  dataPerfil.celular &&
  String(dataPerfil.celular).trim() !== "";

const tieneWhatsApp =
  dataPerfil.whatsapp &&
  String(dataPerfil.whatsapp).trim() !== "";


if (
  tieneRedSocial ||
  tieneCelular ||
  tieneWhatsApp
) {

  botonesContacto = `

    <div class="contact-buttons">

      ${
        tieneRedSocial
        ? `
          <a
            class="contact-button"
            href="${escaparHTML(dataPerfil.red_social)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Red social
          </a>
        `
        : ""
      }


      ${
        tieneCelular
        ? `
          <a
            class="contact-button"
            href="tel:${escaparHTML(dataPerfil.celular)}"
          >
            Llamar
          </a>
        `
        : ""
      }


      ${
        tieneWhatsApp

  dataPerfil.whatsapp
).replace(/\D/g, "")}"

}
/* ======================================
   INFORMACIÓN MÉDICA
====================================== */

let informacionMedica = "";

const tieneAlergias =

        }


        <!-- CONDICIÓN MÉDICA -->

            ${

    dataPerfil.detalle_condicion

        }


        <!-- MEDICAMENTO -->

        ${
          dataPerfil.medicamento

            <strong>

            </strong>

            ${escaparHTML(
              tomaMedicamento
                ? "Sí"

  `;
}

 const beneficiosID = `

`;

  /* ======================================

      <div class="data-grid">
