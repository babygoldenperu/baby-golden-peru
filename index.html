<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Golden ID</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8e8;
      color: #5a3b16;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 40px 20px;
    }

    .logo {
      font-size: 60px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin: 5px 0;
    }

    p {
      font-size: 17px;
    }

    .boton {
      display: block;
      background: #d99b32;
      color: white;
      padding: 16px;
      margin: 20px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="logo">🐶💛</div>

    <h1>Baby Golden ID</h1>

    <p>
      La identificación digital de nuestros Golden Retriever.
    </p>

    <div class="tarjeta">
      <h2>🪪 Identifica a tu perrito</h2>

      <p>
        Registra a tu mejor amigo y forma parte de
        Baby Golden Perú.
      </p>

      <a href="#" class="boton">
        REGISTRAR MI PERRITO
      </a>
    </div>

    <p>
      ❤️ Baby Golden Perú
    </p>

  </div>

</body>
</html>
